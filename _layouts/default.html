<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  <style>
    .site-nav { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    .site-nav a { font-weight: 600; }
    #search-input { flex: 1; min-width: 200px; padding: 6px 10px; font-size: 16px; border: 1px solid #d0d7de; border-radius: 6px; }
    #search-results { margin-bottom: 24px; }
    #search-results[hidden] { display: none; }
    #search-results .meta { color: #57606a; font-size: 14px; }
    #search-results li { margin-bottom: 4px; }
    #search-results mark { background: #fff8c5; padding: 0; }
    #search-results h3 { margin-top: 16px; }
    #search-category { padding: 6px 8px; font-size: 16px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; max-width: 100%; }
    #category-list ul { columns: 14em; }
    #category-list .meta { color: #57606a; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container-lg px-3 my-5 markdown-body">
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <select id="search-category" aria-label="Category"><option value="">전체 (All)</option></select>
      <input id="search-input" type="search" placeholder="검색 (Search)" autocomplete="off" aria-label="Search">
    </nav>
    <section id="search-results" hidden aria-live="polite"></section>
    <main id="content">
      {{ content }}
      {%- if page.url == "/" %}
      <section id="category-list">
        <h2>Categories</h2>
        <ul></ul>
      </section>
      {%- endif %}
    </main>
  </div>
  <script>window.LIFE_LOGS_PAGES = {{ '/assets/pages.json' | relative_url | jsonify }};</script>
  <script src="{{ '/assets/search.js' | relative_url }}"></script>
</body>
</html>
