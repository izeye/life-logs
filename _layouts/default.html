<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="{{ '/assets/site.css?v=' | append: site.github.build_revision | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📔</text></svg>">
</head>
<body{% if page.url == "/" %} class="home"{% endif %}>
  <header class="site-header">
    <div class="bar">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="logo" aria-hidden="true">📔</span>{{ site.title }}</a>
      <div class="search">
        <select id="search-category" aria-label="Category"><option value="">전체</option></select>
        <label class="field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search-input" type="search" placeholder="검색" autocomplete="off" aria-label="Search">
          <kbd>/</kbd>
        </label>
      </div>
    </div>
  </header>
  <div class="wrap">
    <section id="search-results" hidden aria-live="polite"></section>
    <main id="content">
      {%- if page.url == "/" %}
      <section class="hero">
        <h1>{{ site.title }}</h1>
        <p>보고, 먹고, 가고, 즐긴 것들의 기록</p>
      </section>
      <section id="category-list" aria-label="Categories">
        <div class="cards"></div>
      </section>
      {%- endif %}
      <article class="doc">
        {{ content }}
      </article>
    </main>
    <footer class="site-footer">
      <a href="https://github.com/izeye/life-logs">github.com/izeye/life-logs</a>
    </footer>
  </div>
  <script>window.LIFE_LOGS_PAGES = {{ '/assets/pages.json' | relative_url | jsonify }};</script>
  <script src="{{ '/assets/search.js?v=' | append: site.github.build_revision | relative_url }}"></script>
</body>
</html>
